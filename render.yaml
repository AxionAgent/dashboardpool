# Render Blueprint — one-click deploy from this repo.
# Manual equivalent: Build Command: echo "no build needed"  Start Command: npm start  Health Check: /api/health
services:
  - type: web
    name: dashboardpool
    runtime: node
    plan: free
    buildCommand: 'echo "no build needed"'
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: SHEET_ID
        sync: false  # optional override; defaults to Singkawang sheet in server.js
